log_format menarium_json escape=json
  '{"time":"$time_iso8601",'
  '"request_id":"$request_id",'
  '"remote_addr":"$remote_addr",'
  '"method":"$request_method",'
  '"uri":"$uri",'
  '"status":$status,'
  '"bytes":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"upstream_time":"$upstream_response_time",'
  '"user_agent":"$http_user_agent"}';

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Второй рубеж лимитов — перед Node и независимо от того, как приложение
# разбирает заголовки прокси. $binary_remote_addr берётся из TCP-соединения,
# поэтому подделать его заголовком нельзя.
limit_req_zone $binary_remote_addr zone=menarium_auth:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=menarium_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=menarium_site:10m rate=600r/m;
limit_conn_zone $binary_remote_addr zone=menarium_conn:10m;
limit_req_status 429;
limit_conn_status 429;
