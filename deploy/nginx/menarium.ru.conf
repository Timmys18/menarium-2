server {
  listen 80;
  listen [::]:80;
  server_name menarium.ru www.menarium.ru;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 308 https://menarium.ru$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name menarium.ru www.menarium.ru;

  server_tokens off;
  # The app accepts at most 8 MB images plus multipart framing. Reject larger
  # bodies before they reach Node so uploads cannot exhaust application memory.
  client_max_body_size 9m;

  ssl_certificate /etc/letsencrypt/live/menarium.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/menarium.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:MenariumTLS:10m;
  ssl_session_tickets off;

  access_log /var/log/nginx/menarium.access.json menarium_json;
  error_log /var/log/nginx/menarium.error.log warn;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/json application/javascript application/manifest+json image/svg+xml text/css text/plain;

  add_header X-Request-ID $request_id always;

  if ($host = www.menarium.ru) {
    return 308 https://menarium.ru$request_uri;
  }

  location = /api/realtime {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
