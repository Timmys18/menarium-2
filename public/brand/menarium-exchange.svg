<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="896" height="896" viewBox="20 170 856 856"
     role="img" aria-labelledby="title desc">
  <title id="title">Две встречные стрелки в металлическом кольце</title>
  <desc id="desc">Редактируемая векторная версия исходного изображения с прозрачным фоном.</desc>

  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f5f6f6"/>
      <stop offset="24%"  stop-color="#dedfdf"/>
      <stop offset="52%"  stop-color="#c6c8c8"/>
      <stop offset="78%"  stop-color="#aeb0b1"/>
      <stop offset="100%" stop-color="#96999a"/>
    </linearGradient>

    <linearGradient id="blueTop" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%"   stop-color="#2f86cf"/>
      <stop offset="48%"  stop-color="#287ac1"/>
      <stop offset="100%" stop-color="#1260a5"/>
    </linearGradient>

    <linearGradient id="blueBottom" x1="0.1" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#318bd3"/>
      <stop offset="48%"  stop-color="#287ac1"/>
      <stop offset="100%" stop-color="#1260a5"/>
    </linearGradient>

    <linearGradient id="blueBevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0f4f89"/>
      <stop offset="100%" stop-color="#0a3867"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6"
                    flood-color="#27323a" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Металлическое кольцо -->
  <g id="ring">
    <circle cx="448" cy="600" r="350"
            fill="none" stroke="#6f7375" stroke-width="78"/>
    <circle cx="448" cy="594" r="350"
            fill="none" stroke="url(#silver)" stroke-width="68"/>
    <circle cx="448" cy="586" r="350"
            fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
    <circle cx="448" cy="602" r="313"
            fill="none" stroke="#65696b" stroke-opacity="0.72" stroke-width="6"/>
  </g>

  <!-- Верхняя стрелка вправо -->
  <g id="arrow-right" filter="url(#softShadow)">
    <path d="
      M 76 451
      L 570 451
      L 570 374
      L 719 501
      L 570 628
      L 570 558
      L 46 558
      Z"
      fill="url(#blueTop)"
      stroke="#0c4e88" stroke-width="5" stroke-linejoin="miter"/>

    <!-- левый нижний скос -->
    <path d="M 46 558 L 76 451 L 91 459 L 61 550 Z"
          fill="url(#blueBevel)" opacity="0.92"/>

    <!-- верхняя световая грань -->
    <path d="M 80 456 L 577 456 L 577 390 L 704 500"
          fill="none" stroke="#77c6f4" stroke-opacity="0.62"
          stroke-width="5" stroke-linejoin="miter"/>

    <!-- нижняя грань наконечника -->
    <path d="M 570 620 L 710 501"
          fill="none" stroke="#083b70" stroke-opacity="0.65" stroke-width="6"/>
  </g>

  <!-- Нижняя стрелка влево -->
  <g id="arrow-left" filter="url(#softShadow)">
    <path d="
      M 850 659
      L 820 768
      L 316 768
      L 316 833
      L 181 712
      L 316 591
      L 316 659
      Z"
      fill="url(#blueBottom)"
      stroke="#0c4e88" stroke-width="5" stroke-linejoin="miter"/>

    <!-- правый нижний скос -->
    <path d="M 850 659 L 820 768 L 805 759 L 834 667 Z"
          fill="url(#blueBevel)" opacity="0.92"/>

    <!-- верхняя световая грань -->
    <path d="M 838 665 L 309 665 L 309 608 L 194 712"
          fill="none" stroke="#77c6f4" stroke-opacity="0.58"
          stroke-width="5" stroke-linejoin="miter"/>

    <!-- нижняя грань наконечника -->
    <path d="M 188 712 L 309 822"
          fill="none" stroke="#083b70" stroke-opacity="0.65" stroke-width="6"/>
  </g>
</svg>
