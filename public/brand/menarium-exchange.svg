<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="896" height="896" viewBox="20 170 856 856">
  <defs>
    <!-- PURE VECTOR: no embedded raster/image -->
    <linearGradient id="ringMetal" x1="0" y1="210" x2="0" y2="990" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eef0ef"/>
      <stop offset="0.16" stop-color="#d9dbda"/>
      <stop offset="0.43" stop-color="#c5c7c6"/>
      <stop offset="0.68" stop-color="#b9bbba"/>
      <stop offset="1" stop-color="#9fa1a0"/>
    </linearGradient>

    <linearGradient id="ringEdge" x1="0" y1="210" x2="0" y2="990" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cfd3d2"/>
      <stop offset="0.48" stop-color="#727679"/>
      <stop offset="1" stop-color="#64686b"/>
    </linearGradient>

    <linearGradient id="ringGloss" x1="180" y1="260" x2="720" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".64"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".72" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".12"/>
    </linearGradient>

    <linearGradient id="arrowBlue" x1="80" y1="405" x2="770" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2e83ca"/>
      <stop offset=".46" stop-color="#2878be"/>
      <stop offset=".78" stop-color="#2471b8"/>
      <stop offset="1" stop-color="#1a61a3"/>
    </linearGradient>

    <linearGradient id="arrowBlue2" x1="180" y1="600" x2="850" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3188ce"/>
      <stop offset=".48" stop-color="#2879bf"/>
      <stop offset=".82" stop-color="#2572b6"/>
      <stop offset="1" stop-color="#1a61a3"/>
    </linearGradient>

    <linearGradient id="bevelDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#185b99"/>
      <stop offset="1" stop-color="#0d4377"/>
    </linearGradient>

    <linearGradient id="bevelLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67b7ed"/>
      <stop offset="1" stop-color="#2d8cd1"/>
    </linearGradient>

    <filter id="ringSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4"
                    flood-color="#4b4e50" flood-opacity=".34"/>
    </filter>

    <!-- Arrows are clipped exactly by the OUTER circle radius.
         This is the requested geometry change; nothing can protrude beyond the circle. -->
    <clipPath id="circleClip">
      <circle cx="448" cy="600" r="384"/>
    </clipPath>
  </defs>

  <!-- silver circular ring -->
  <g id="ring" filter="url(#ringSoftShadow)">
    <!-- outer dark rim -->
    <circle cx="448" cy="600" r="347"
            fill="none" stroke="url(#ringEdge)" stroke-width="82"/>

    <!-- main metallic face -->
    <circle cx="448" cy="594" r="347"
            fill="none" stroke="url(#ringMetal)" stroke-width="70"/>

    <!-- inner dark bevel -->
    <circle cx="448" cy="600" r="311"
            fill="none" stroke="#676b6e" stroke-width="7" opacity=".92"/>

    <!-- outer bright bevel -->
    <circle cx="448" cy="589" r="382"
            fill="none" stroke="#ffffff" stroke-width="4" opacity=".20"/>

    <!-- glossy pass -->
    <path d="M 98 439
             A 384 384 0 0 1 448 216
             A 384 384 0 0 1 793 443"
          fill="none" stroke="url(#ringGloss)" stroke-width="18"
          stroke-linecap="round" opacity=".56"/>
  </g>

  <!-- arrows -->
  <g id="arrows" clip-path="url(#circleClip)">

    <!-- TOP ARROW: darker extruded underside -->
    <path d="M 73 458
             L 579 458
             L 579 387
             L 728 505
             L 579 635
             L 579 564
             L 50 564
             Z"
          fill="url(#bevelDark)" opacity=".95"/>

    <!-- TOP ARROW main face -->
    <path d="M 76 451
             L 570 451
             L 570 373
             L 719 501
             L 570 629
             L 570 558
             L 46 558
             Z"
          fill="url(#arrowBlue)"
          stroke="#14588f" stroke-width="2.2"
          stroke-linejoin="miter"/>

    <!-- TOP ARROW left bevel -->
    <path d="M 46 558 L 76 451 L 86 458 L 60 551 Z"
          fill="url(#bevelDark)" opacity=".96"/>

    <!-- TOP ARROW bright top edge -->
    <path d="M 80 459
             L 579 459
             L 579 394
             L 704 501"
          fill="none" stroke="#5db2eb" stroke-width="5.2"
          stroke-linejoin="miter" stroke-linecap="square" opacity=".72"/>

    <!-- TOP ARROW head highlight -->
    <path d="M 578 391 L 704 500 L 694 500 L 578 406 Z"
          fill="url(#bevelLight)" opacity=".48"/>

    <!-- BOTTOM ARROW: darker extruded underside -->
    <path d="M 855 664
             L 323 664
             L 323 603
             L 187 718
             L 323 839
             L 323 775
             L 826 775
             Z"
          fill="url(#bevelDark)" opacity=".95"/>

    <!-- BOTTOM ARROW main face -->
    <path d="M 850 658
             L 316 658
             L 316 590
             L 180 712
             L 316 834
             L 316 769
             L 821 769
             Z"
          fill="url(#arrowBlue2)"
          stroke="#14588f" stroke-width="2.2"
          stroke-linejoin="miter"/>

    <!-- BOTTOM ARROW right bevel -->
    <path d="M 850 658 L 821 769 L 808 761 L 836 666 Z"
          fill="url(#bevelDark)" opacity=".96"/>

    <!-- BOTTOM ARROW bright top edge -->
    <path d="M 835 666
             L 309 666
             L 309 608
             L 195 712"
          fill="none" stroke="#5db2eb" stroke-width="5.2"
          stroke-linejoin="miter" stroke-linecap="square" opacity=".70"/>

    <!-- BOTTOM ARROW head highlight -->
    <path d="M 195 712 L 309 608 L 309 621 L 208 712 Z"
          fill="url(#bevelLight)" opacity=".48"/>
  </g>
</svg>
