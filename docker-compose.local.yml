services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: menarium2
      POSTGRES_USER: menarium
      POSTGRES_PASSWORD: menarium_local_password
    ports:
      - "5432:5432"
    volumes:
      - menarium_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menarium -d menarium2"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - menarium_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  menarium_postgres:
  menarium_redis:
