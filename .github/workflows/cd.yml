name: CD

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: menarium:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image ready
        run: echo "Docker image menarium:latest built successfully — push to your registry from your deploy pipeline."
